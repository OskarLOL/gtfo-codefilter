name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release --bin gtfo-codefilter
          cargo build --release --bin cli
          strip target/release/gtfo-codefilter || true
          strip target/release/cli || true

      - name: Package artifacts
        run: |
          mkdir -p release
          cp target/release/gtfo-codefilter release/
          cp target/release/cli release/gtfo-codefilter-cli
          tar -czf gtfo-codefilter-linux-x86_64.tar.gz -C release .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: gtfo-codefilter-linux-x86_64.tar.gz

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross

      - name: Build release binaries
        run: |
          cargo build --release --bin gtfo-codefilter --target x86_64-pc-windows-gnu
          cargo build --release --bin cli --target x86_64-pc-windows-gnu
          x86_64-w64-mingw32-strip target/x86_64-pc-windows-gnu/release/*.exe || true

      - name: Package artifacts
        run: |
          mkdir -p release
          cp target/x86_64-pc-windows-gnu/release/gtfo-codefilter.exe release/
          cp target/x86_64-pc-windows-gnu/release/cli.exe release/gtfo-codefilter-cli.exe
          cd release && zip ../gtfo-codefilter-windows-x86_64.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: gtfo-codefilter-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/linux-x86_64/gtfo-codefilter-linux-x86_64.tar.gz
            artifacts/windows-x86_64/gtfo-codefilter-windows-x86_64.zip